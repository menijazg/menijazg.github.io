name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          ACCB9E: ${{ secrets.ACCB9E }}
          BC1AC8: ${{ secrets.BC1AC8 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('ACCB9E', '')
          tag_b = os.environ.get('BC1AC8', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- d4cefae047a37a418f7001534605956194661f30fddd -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- cf9f5091ce9f8c43d720c0e1312fd6f1732a851a -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
